<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>나의 첫 번째 웹사이트</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh; display: flex; align-items: center; justify-content: center;
      padding: 16px; background: linear-gradient(135deg, #1976d2, #42a5f5);
      font-family: -apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif;
    }
    .card {
      width: 100%; max-width: 480px; padding: 40px 28px; text-align: center;
      background: #fff; border-radius: 16px; box-shadow: 0 12px 32px rgba(0, 0, 0, 0.18);
    }
    .emoji { font-size: 3rem; }
    h1 { margin: 16px 0 12px; font-size: clamp(1.5rem, 5vw, 2rem); color: #1976d2; }
    p { line-height: 1.6; color: #555; font-size: clamp(0.95rem, 3.5vw, 1.05rem); }
    .btn {
      display: inline-block; margin-top: 24px; padding: 12px 28px; border-radius: 999px;
      background: #1976d2; color: #fff; text-decoration: none; font-weight: 600;
    }
    .btn:hover { background: #1565c0; }
  </style>
</head>
<body>
  <main class="card">
    <div class="emoji">👋</div>
    <h1>환영합니다!</h1>
    <p>바이브 코딩으로 만든 나의 첫 번째 웹사이트입니다.<br>Claude Code와 함께 하나씩 배우며 성장하고 있어요.</p>
    <a class="btn" href="https://github.com/zzasg961-svg/my-first-website">GitHub 저장소 보기</a>
  </main>
</body>
</html>
